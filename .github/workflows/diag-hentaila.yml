# TEMPORAL: se borra después de leer el resultado.
name: Diagnóstico Hentaila (temporal)

on:
  push:
    branches: [diag-hentaila]

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install requests beautifulsoup4 html5lib curl_cffi pillow

      - name: Probar TODAS las portadas del catálogo
        run: python diag/diag_todo.py

      - name: Guardar el resultado en la rama
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diag
          git commit -m "diag: resultado" || echo "nada que guardar"
          git pull --rebase origin diag-hentaila || true
          git push
