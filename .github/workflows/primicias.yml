# Arma cada hora, con cine/Archivos/build_primicias.py, los JSON del Home privado y los sube al repo:
#   cine/Archivos/primicias.json   Primicias H en español (buscador de muchohentai)
#   cine/Archivos/top10.json       Top 10 de la semana (Hentaila: ahí se mudó VeoHentai)
#   cine/Archivos/mas_vistos.json  Más vistos (Hentaila)
#   cine/Archivos/avances.json     Avances recientes (PV de muchohentai)
#   cine/Archivos/comics.json      Comics (los dos sitios)
# GitHub Pages los sirve en https://todesvip.github.io/visor-manga/cine/Archivos/ y la app solo los descarga
# (config/urls/primicias, top10, mas_vistos, avances y comics en Firebase).
#
# Para cambiar cada cuánto corre, toca solo la línea del cron (está en hora UTC; Lima = UTC-5):
#   "23 * * * *"    cada hora, al minuto 23
#   "23 */3 * * *"  cada 3 horas
# También se puede lanzar a mano: pestaña Actions → "Primicias H en español" → Run workflow.

name: Primicias H en español

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: primicias
  cancel-in-progress: false

jobs:
  armar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Bajar el repo
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install requests beautifulsoup4 html5lib curl_cffi

      - name: Armar los JSON (primicias, top10, mas_vistos, avances, comics)
        run: python cine/Archivos/build_primicias.py --salida cine/Archivos/primicias.json

      - name: Subir al repo si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in cine/Archivos/primicias.json cine/Archivos/top10.json cine/Archivos/mas_vistos.json cine/Archivos/avances.json cine/Archivos/comics.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Sin cambios: no se sube nada"
            exit 0
          fi
          git commit -m "Home privado: actualización automática ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          # el workflow del Catálogo (catalogo.yml) también sube a esta rama: si se adelantó, se acomoda encima y se reintenta
          for intento in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((intento * 5))
          done
          exit 1
