# Arma cada hora, con cine/Archivos/build_primicias.py, los JSON del Home privado y los sube al repo:
#   cine/Archivos/primicias.json      Primicias H en español (buscador de muchohentai)
#   cine/Archivos/privados_home.json  Top 10, Más vistos (VeoHentai), Avances (PV) y Comics
# GitHub Pages los sirve en https://todesvip.github.io/visor-manga/cine/Archivos/ y la app solo los descarga
# (config/urls/primicias y config/urls/privados_home en Firebase).
#
# Para cambiar cada cuánto corre, toca solo la línea del cron (está en hora UTC; Lima = UTC-5):
#   "23 * * * *"    cada hora, al minuto 23
#   "23 */3 * * *"  cada 3 horas
# También se puede lanzar a mano: pestaña Actions → "Primicias H en español" → Run workflow.

name: Primicias H en español

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: primicias
  cancel-in-progress: false

jobs:
  armar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Bajar el repo
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install requests beautifulsoup4 html5lib

      - name: Armar primicias.json y privados_home.json
        run: python cine/Archivos/build_primicias.py --salida cine/Archivos/primicias.json

      - name: Subir al repo si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in cine/Archivos/primicias.json cine/Archivos/privados_home.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Sin cambios: no se sube nada"
            exit 0
          fi
          git commit -m "Home privado: actualización automática ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git push
