# Arma cada 6 horas, con cine/Archivos/build_catalogo.py, el Catálogo y los Géneros del modo privado y los sube al repo:
#   cine/Archivos/catalogo.json  Todos los episodios de Hentaila (póster, estudio, año, imagen horizontal) + estudios y años
#   cine/Archivos/generos.json   Los géneros con su miniatura, su primera página y la lista completa de episodios
# (VeoHentai se mudó a Hentaila: de ahí salen ahora.) GitHub Pages los sirve en
# https://todesvip.github.io/visor-manga/cine/Archivos/ y la app solo los descarga
# (config/urls/catalogo y config/urls/generos en Firebase).
#
# Para cambiar cada cuánto corre, toca solo la línea del cron (está en hora UTC; Lima = UTC-5):
#   "17 */6 * * *"   cada 6 horas, al minuto 17
#   "17 */3 * * *"   cada 3 horas
# También se puede lanzar a mano: pestaña Actions → "Catálogo y géneros" → Run workflow.

name: Catálogo y géneros

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  armar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Bajar el repo
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install requests beautifulsoup4 html5lib curl_cffi

      - name: Armar catalogo.json y generos.json (hasta 3 intentos)
        id: armar
        run: |
          for intento in 1 2 3; do
            if python cine/Archivos/build_catalogo.py --carpeta cine/Archivos; then
              exit 0
            fi
            echo "::warning::Intento $intento incompleto; se espera y se vuelve a intentar"
            sleep $((intento * 60))
          done
          exit 1

      - name: Subir al repo si cambió
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in cine/Archivos/catalogo.json cine/Archivos/generos.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Sin cambios: no se sube nada"
            exit 0
          fi
          git commit -m "Catálogo y géneros: actualización automática ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          # otro workflow (el del Home) puede haber subido algo mientras tanto: se acomoda encima y se reintenta
          for intento in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((intento * 5))
          done
          exit 1
