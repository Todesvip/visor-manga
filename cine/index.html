<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Todesvip</title>
    <!-- Librería de subtítulos -->
    <script src="https://todesvip.github.io/visor-manga/assets/js/subtitles-octopus.js"></script>

    <!-- OPTIMIZACIÓN: Preconectar a servidores para que el video inicie antes -->

    <style>
        /* --- ESTILOS GENERALES --- */
        :root { --bg: #000000; --text: #ffffff; --text-gray: #a8a8a8; --accent: #ffffff; }
        
        /* --- ELIMINAR SOMBRA DE CONTROLES DE VIDEO --- */
        video::-webkit-media-controls-panel {
            background-image: none !important;
        }
        /* --------------------------------------------- */        
        body { 
            margin: 0; padding: 0; 
            background-color: var(--bg); color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Evitar arrastrar imágenes al deslizar en móvil */
        img {
            -webkit-user-drag: none;
            -webkit-user-select: none;
            user-select: none;
            pointer-events: none;
        }

        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }

        /* --- HOME --- */
        header { 
            padding: 15px 20px; 
            background-color: #101010; /* Color Jellyfin (Gris muy oscuro) */
            position: fixed; width: 100%; z-index: 50; top:0; 
            pointer-events: auto;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        .header-content { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .header-right { display: flex; gap: 20px; align-items: center; }
        .nav-btn { background: none; border: none; padding: 0; cursor: pointer; display: flex; }
        .nav-btn svg { width: 28px; height: 28px; fill: #b0b0b0; filter: drop-shadow(0 2px 5px black); transition: fill 0.2s; }
        .nav-btn:hover svg { fill: white; }

        /* LOGO MÁS GRANDE */
        .logo-btn svg { width: 45px; height: 45px; transition: none; }

        /* --- CAMPO DE CÓDIGO (REEMPLAZA LOGO) --- */
        .code-input-container {
            flex-basis: 100px; /* Ancho base */
            margin-right: 10px;
        }
        .code-input {
            width: 100%;
            background-color: rgba(15, 15, 15, 0.75);
            color: #ccc; border: none; border-radius: 8px;
            padding: 8px 12px; font-size: 14px; font-weight: 600;
            outline: none;
            text-align: center; letter-spacing: 2px;
        }
        .code-input::placeholder { color: #888; letter-spacing: normal; }
        .code-input.shake, .header-search-input.shake, .chapter-input.shake { animation: shake 0.7s cubic-bezier(.36,.07,.19,.97) both; }
        /* Ocultar flechas en input de número */
        .code-input::-webkit-outer-spin-button, .code-input::-webkit-inner-spin-button, .chapter-input::-webkit-outer-spin-button, .chapter-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .code-input[type=number], .chapter-input[type=number] { -moz-appearance: textfield; }
        
        /* --- BUSCADOR EN HEADER --- */
        .header-search-container {
            flex: 1; margin: 0 15px; display: flex; justify-content: flex-end; }
        .header-search-active-view {
            display: none; /* Oculto por defecto */
            align-items: center;
            gap: 10px;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            padding: 0 15px;
            box-sizing: border-box;
            background-color: #101010; /* Mismo que el header */
            z-index: 1;
        }
        header.search-active .header-search-active-view {
            display: flex; /* Se muestra en modo búsqueda */
        }
        header.search-active .header-content {
            visibility: hidden; /* Se oculta el contenido normal para mantener la altura */
        }

        .header-search-input {
            width: 100%; max-width: 300px;
            flex-grow: 1; /* Ocupa el espacio restante */
            background-color: #1e1e24;
            color: #ccc;
            border: none; border-radius: 8px;
            padding: 8px 12px; font-size: 14px; font-weight: 500;
            outline: none; transition: width 0.3s;
            outline: none;
        }
        .header-search-input::placeholder { color: #888; }

        /* --- RESULTADOS DE BÚSQUEDA (TEXTO) --- */
        #global-search-results {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0a;
            z-index: 45; overflow-y: auto; display: none;
            padding: 80px 0 20px 0;
            box-sizing: border-box;
        }
        .search-result-card {
            display: flex; gap: 15px; padding: 15px;
            border-bottom: none;
            cursor: pointer; transition: background 0.2s;
        }
        .search-result-card:hover { background: #1a1a1a; }
        .search-poster-img {
            width: 100px; aspect-ratio: 2/3; object-fit: cover; 
            border-radius: 0; flex-shrink: 0;
        }
        .search-info {
            display: flex; flex-direction: column; justify-content: center;
        }
        .search-title {
            color: #ffffff; font-size: 15px; font-weight: 700; margin-bottom: 5px;
        }
        .search-desc {
            color: #ccc; font-size: 11px; line-height: 1.4;
            display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
        }

        /* --- NUEVO HOME (HORIZONTAL) --- */
        .section-title {
            font-size: 16px; font-weight: 600; margin: 15px 0 10px 0; padding-left: 20px; color: #ffffff;
            letter-spacing: 0px;
        }

        .home-content { padding-top: 80px; }

        .horizontal-list {
            display: flex; overflow-x: auto; gap: 10px; padding: 0;
            scroll-padding-left: 20px; /* Para que el snap se alinee con el título */
            scrollbar-width: none; margin-bottom: 25px;
            scroll-snap-type: x mandatory;
        }
        
        /* Espaciadores para alinear */
        .horizontal-list::before, .horizontal-list::after {
            content: ''; display: block; flex: 0 0 10px;
        }

        #recent-list { padding-left: 0; }

        .horizontal-list::-webkit-scrollbar { display: none; }
        
        .horizontal-item { flex: 0 0 130px; cursor: pointer; scroll-snap-align: start; transition: transform 0.2s; }
        .horizontal-item:active { transform: scale(0.95); }

        @media (max-width: 600px) {
            .horizontal-item { flex: 0 0 30vw; }
        }

        .view-all-btn {
            display: none; /* Se oculta por defecto, se activa con JS si > 10 */
            width: calc(100% - 30px); margin: 0 auto 30px;
            padding: 12px; background: #1e1e24; border: 1px solid #333;
            color: var(--accent); border-radius: 8px; font-weight: 600; cursor: pointer;
            text-align: center; font-size: 14px;
        }

        /* --- DIRECTORIO (GRID TIPO SASA) --- */
        .directory-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            padding: 0 15px 20px; margin-top: 80px; /* Margen para bajarlo del header fijo */
        }
        .dir-card {
            background-color: #1e1e24; border-radius: 16px; height: 100px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-decoration: none; color: white; position: relative; cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .dir-card:active { transform: scale(0.96); background-color: #25252b; }
        
        .dir-icon {
            width: 28px; height: 28px; margin-bottom: 8px;
            fill: var(--accent);
        }
        .dir-title {
            font-size: 14px; font-weight: 700; margin-bottom: 2px;
        }
        .dir-subtitle {
            font-size: 11px; color: var(--text-gray);
        }

        /* --- LISTA COMPLETA (GRID 2 COLUMNAS) --- */
        .full-list-grid {
            padding: 80px 15px 20px;
            display: grid; grid-template-columns: 1fr 1fr; 
            gap: 15px;
        }
        .poster-wrapper { cursor: pointer; }
        .poster {
            width: 100%; aspect-ratio: 2/3; border-radius: 0; overflow: hidden; background: #1a1a1a;
            margin-bottom: 8px;
        }
        .poster img { width: 100%; height: 100%; object-fit: cover; }
        .anime-title { font-size: 13px; font-weight: 500; color: #ddd; }

        /* --- DETALLE --- */
        .hero-container {
            position: relative; width: 100%; aspect-ratio: 16/9; background: #000;
        }
        .hero-bg { width: 100%; height: 100%; object-fit: cover; display: none; } 
        
        /* --- REPRODUCTOR AVANZADO (INTEGRACIÓN) --- */
        #video-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; z-index: 30; display: none; /* Oculto por defecto */
            pointer-events: auto;
        }
        
        #main-video { 
            width: 100%; height: 100%; display: block; object-fit: contain; position: relative; z-index: 0; pointer-events: none;
            /* FORZAR ACELERACIÓN DE HARDWARE (Hace que vaya más fluido en Android) */
            transform: translate3d(0, 0, 0); will-change: transform;
            background-color: #000; /* Fondo negro para videos sin poster */
        }

        /* --- SPINNER CARGA VIDEO --- */
        .video-loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 25; pointer-events: none; display: none;
        }
        .video-spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* CAPA DE CONTROLES (OVERLAY) */
        .controls-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.5), transparent 25%, transparent 75%, rgba(0,0,0,0.5));
            opacity: 0; transition: opacity 0.3s;
            pointer-events: none;
            z-index: 20;
        }

        /* Mostrar controles cuando esté activo o pausado */
        #video-container.active .controls-overlay,
        #video-container.paused .controls-overlay { opacity: 1; pointer-events: none; }
        #video-container.active .controls-overlay { opacity: 1; pointer-events: none; }

        /* CONTENEDOR CENTRAL */
        .center-controls {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; align-items: center; gap: 20px;
            pointer-events: none;
        }

        /* BOTÓN PLAY GIGANTE CENTRAL */
        .center-play {
            position: relative; transform: none; top: auto; left: auto;
            width: 80px; height: 80px; background: none; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer; border: none;
            pointer-events: auto;
        }
        /* BOTONES SKIP */
        .skip-btn {
            width: 80px; height: 80px; background: none;
            display: flex; justify-content: center; align-items: center; cursor: pointer; border: none;
            pointer-events: auto;
        }
        .skip-btn svg { width: 48px; height: 48px; }

        .center-play svg {
            width: 48px; height: 48px; fill: white;
        }
        /* Ajuste visual solo para el ícono de Play (cuando está pausado) */
        #video-container.paused .center-play svg { margin-left: 4px; }

        /* BARRA SUPERIOR (NUEVO) */
        .top-bar {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 15px 20px; box-sizing: border-box;
            display: flex; justify-content: flex-end; align-items: center;
            pointer-events: none; z-index: 22;
        }

        /* BARRA INFERIOR */
        .bottom-bar {
            background: transparent;
            /* Contenedor para la fila de controles, se posiciona al fondo */
            position: absolute; bottom: 20px; /* Un poco más arriba para separar de la barra de progreso */
            left: 0; width: 100%;
            pointer-events: none;
        }

        /* FILA DE CONTROLES */
        .controls-row { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 20px; box-sizing: border-box; }

        /* TIEMPOS */
        .time-text { 
            color: #ffffff; /* Blanco puro para ambos tiempos */
            font-size: 13px; font-weight: 600; 
            font-variant-numeric: tabular-nums;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* BARRA DE PROGRESO */
        .progress-container {
            /* Se posiciona absolutamente en el borde inferior */
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 5px; /* Área táctil reducida */
            display: flex; align-items: flex-end; cursor: pointer;
            pointer-events: auto;
        }
        .progress-bg { width: 100%; height: 3px; background: rgba(255, 255, 255, 0.2); position: relative; }
        .progress-fill { height: 100%; width: 0%; background: white; position: absolute; top: 0; left: 0; }
        .progress-handle {
            width: 8px; height: 8px; background: white; border-radius: 50%;
            position: absolute; top: 50%; left: 0%; transform: translate(-50%, -50%);
            z-index: 5;
            transition: width .15s ease, height .15s ease;
        }
        .progress-container:active .progress-handle { width: 12px; height: 12px; }

        /* MINIATURA DE VISTA PREVIA */
        .preview-box {
            position: absolute; bottom: 20px; left: 0; transform: translateX(-50%);
            width: 160px; height: 90px; background: #000;
            border: none; border-radius: 0;
            display: none; overflow: hidden; pointer-events: none; z-index: 30;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .preview-box video {
            width: 100%; height: 100%; object-fit: cover; opacity: 0.8;
        }
        #preview-img {
            width: 100%; height: 100%;
            background-color: #000;
            background-repeat: no-repeat;
            display: none;
        }

        /* BOTONES DERECHA */
        .right-buttons { display: flex; gap: 10px; align-items: center; pointer-events: auto; }
        .icon-btn { background: none; border: none; cursor: pointer; padding: 5px; display: flex; justify-content: center; align-items: center; opacity: 0.8; transition: opacity 0.2s; }
        .icon-btn:hover { opacity: 1; }
        .icon-btn svg { width: 24px; height: 24px; fill: white; }
        
        /* MENÚ DE SUBTÍTULOS */
        .cc-menu-container { position: relative; }
        .cc-menu {
            display: none; position: absolute; top: 100%; right: 0; /* Abre hacia abajo ahora */
            background: rgba(18, 18, 18, 0.95); border-radius: 0;
            margin-top: 10px; min-width: 150px; z-index: 21;
            pointer-events: auto;
        }
        .cc-menu button {
            background: none; border: none; color: #ccc; font-size: 14px;
            padding: 10px 20px; width: 100%; text-align: left; cursor: pointer; display: block;
        }
        .cc-menu button:hover { background: rgba(255, 255, 255, 0.1); }
        .cc-menu button.active { font-weight: bold; color: #fff; background: rgba(255, 255, 255, 0.05); }
        
        /* CANVAS SUBTÍTULOS */
        #video-container canvas {
            position: absolute !important; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        .content-body { padding: 20px; position: relative; z-index: 25; background-color: var(--bg); }
        
        .show-title { 
            font-size: 18px; 
            font-weight: 800; 
            line-height: 1.2; 
            margin-bottom: 8px; 
            cursor: pointer; 
            color: #eee; letter-spacing: 0.5px;
            width: fit-content;
        }
        .show-title:active { opacity: 0.7; }

        .show-subtitle {
            font-size: 15px;
            color: var(--text-gray);
            margin-bottom: 12px;
            font-family: 'Noto Sans JP', sans-serif;
        }

        .meta-row { display: flex; gap: 10px; font-size: 13px; color: var(--text-gray); margin-bottom: 20px; align-items: center; }
        .badge { border: 1px solid var(--text-gray); padding: 1px 4px; border-radius: 2px; font-size: 11px; }

        /* --- SELECTOR DE EPISODIOS (CUADROS) --- */
        .ep-count-header {
            text-align: right; color: var(--text-gray); font-size: 12px; margin-bottom: 8px; font-weight: 500;
        }

        .ep-selector-row {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px;
            scrollbar-width: none; 
        }
        .ep-selector-row::-webkit-scrollbar { display: none; }

        .ep-box {
            width: 50px; height: 50px; 
            background: #1e1e24;
            border-radius: 8px; border: none;
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 1rem; color: #ccc; flex-shrink: 0;
            cursor: pointer; transition: transform 0.2s, background 0.2s;
            overflow: hidden;
        }
        .ep-box.active {
            background: #000000;
        }
        .ep-box:active { transform: none; }

        /* --- SINOPSIS --- */
        .synopsis { font-size: 13px; line-height: 1.5; color: #ccc; margin-bottom: 5px; }
        .read-more-btn {
            display: none !important;
        }

        /* Botón volver genérico */
        .back-btn {
            background: none; border: none; color: white; font-size: 16px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 5px;
        }

        /* Ajuste para que el contenido no quede tapado por el nav */
        .view { padding-bottom: 20px; }
        
        /* AJUSTES */
        .settings-content { padding: 40px 20px; text-align: center; color: #777; }
        
        /* --- SWITCH TOGGLE (Ajustes) --- */
        .switch-container {
            display: flex; align-items: center; justify-content: space-between;
            background: #1e1e24; padding: 15px; border-radius: 8px; margin: 20px auto;
            text-align: left; max-width: 400px;
        }
        .switch-label { font-size: 15px; color: white; font-weight: 500; }
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(22px); }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s ease-out;
        }
        .splash-content { text-align: center; display: flex; flex-direction: column; align-items: center; }
        .loading-spinner {
            width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #ffffff; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #splash-status { color: #888; font-size: 14px; font-weight: 500; display: none; margin-top: 20px; }
        #retry-btn {
            margin-top: 20px; padding: 10px 25px; background: var(--accent); color: black;
            border: none; border-radius: 20px; font-weight: bold; cursor: pointer; display: none;
        }

        /* --- PAGINACIÓN --- */
        .pagination-container {
            display: flex; justify-content: center; gap: 8px; padding: 20px 0;
            width: 100%;
        }
        .page-btn {
            background: #1e1e24; color: #ccc; border: none;
            width: 35px; height: 35px; border-radius: 50%;
            font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, color 0.2s;
        }
        .page-btn.active {
            background: var(--accent); color: black;
        }

    </style>
</head>
<body>

    <!-- SPLASH SCREEN -->
    <div id="splash-screen">
        <div class="splash-content">
            <div class="loading-spinner" id="splash-spinner"></div>
            <div id="splash-status"></div>
            <button id="retry-btn" onclick="location.reload()">Reintentar</button>
        </div>
    </div>

    <!-- HEADER GLOBAL (Movido fuera de home-view) -->
    <header id="main-header">
        <div class="header-content">
            <div class="code-input-container">
                <input type="tel" id="code-input" class="code-input" placeholder="Clave" pattern="[0-9]*" inputmode="numeric">
            </div>
            
            <div class="header-search-container">
                <input type="text" id="header-search-input" class="header-search-input" placeholder="Buscar..." oninput="handleGlobalSearch(this)">
            </div>

            <div class="header-right">
                <div class="nav-btn" id="search-action-btn">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </div>
                <div class="nav-btn" onclick="toggleAppMode()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M10.7577 11.8281L18.6066 3.97919L20.0208 5.3934L18.6066 6.80761L21.0815 9.28249L19.6673 10.6967L17.1924 8.22183L15.7782 9.63604L17.8995 11.7574L16.4853 13.1716L14.364 11.0503L12.1719 13.2423C13.4581 15.1837 13.246 17.8251 11.5355 19.5355C9.58291 21.4882 6.41709 21.4882 4.46447 19.5355C2.51184 17.5829 2.51184 14.4171 4.46447 12.4645C6.17493 10.754 8.81633 10.5419 10.7577 11.8281ZM10.1213 18.1213C11.2929 16.9497 11.2929 15.0503 10.1213 13.8787C8.94975 12.7071 7.05025 12.7071 5.87868 13.8787C4.70711 15.0503 4.70711 16.9497 5.87868 18.1213C7.05025 19.2929 8.94975 19.2929 10.1213 18.1213Z"></path></svg>
                </div>
            </div>
        </div>
        <div class="header-search-active-view">
            <div class="nav-btn" id="search-back-btn">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </div>
            <input type="text" id="header-search-input-mobile" class="header-search-input" placeholder="Buscar..." oninput="handleGlobalSearch(this)">
        </div>
    </header>

    <!-- RESULTADOS DE BÚSQUEDA GLOBAL (TEXTO) -->
    <div id="global-search-results"></div>

    <!-- HOME -->

<script>
    // Combinar todas las listas públicas para el buscador y la lista completa
    const publicLibrary = [
        ...(typeof recientesData !== 'undefined' ? recientesData : []),
        ...(typeof popularesData !== 'undefined' ? popularesData : []),
        ...(typeof seriesData !== 'undefined' ? seriesData : [])
    ];
    const privateLibrary = typeof privadosData !== 'undefined' ? privadosData : [];
    let library = publicLibrary;
</script>

<script>
    // --- VARIABLES DE ESTADO ---
    let currentAnime = null;
    let currentEpIndex = 0;
    let hasPlayedAnyVideo = false; // [NUEVO] Flag para la nueva lógica de autoplay
    let isRestrictedMode = false;
    let privatePage = 1; // Página actual del modo privado
    const itemsPerPage = 20; // 2 columnas * 10 filas = 20 items
    const SECRET_CODE = "4560";

    // --- ELEMENTOS DOM ---
    const homeView = document.getElementById('home-view');
    const exploreView = document.getElementById('explore-view');
    const settingsView = document.getElementById('settings-view');
    const fullListView = document.getElementById('full-list-view');
    const detailView = document.getElementById('detail-view');
    const fullGrid = document.getElementById('full-grid');
    const mainVideo = document.getElementById('main-video');
    const videoContainer = document.getElementById('video-container'); // Contenedor del reproductor
    const videoLoader = document.getElementById('video-loader'); // Spinner
    
    // Elementos del reproductor personalizado
    const btnCenter = document.getElementById('btn-center-play');
    const btnCC = document.getElementById('btn-cc');
    const ccMenu = document.getElementById('cc-menu');
    const btnFS = document.getElementById('btn-fs');
    const progressArea = document.getElementById('progress-area');
    const progressBar = document.getElementById('progress-bar');
    const progressKnob = document.getElementById('progress-knob');
    const currTimeText = document.getElementById('curr-time');
    const durTimeText = document.getElementById('dur-time');
    
    const previewBox = document.getElementById('preview-box');
    const previewImg = document.getElementById('preview-img');

    const heroImg = document.getElementById('hero-img');
    const heroArea = document.getElementById('hero-area');
    
    const detailTitle = document.getElementById('detail-title');
    const detailSubtitle = document.getElementById('detail-subtitle');
    const epCountText = document.getElementById('ep-count-text');
    const epSelector = document.getElementById('ep-selector');
    const detailSynopsis = document.getElementById('detail-synopsis');

    const detailRating = document.getElementById('detail-rating');
    const detailSeason = document.getElementById('detail-season');
    const detailYear = document.getElementById('detail-year');
    const detailQuality = document.getElementById('detail-quality');

    const headerSearchInput = document.getElementById('header-search-input');
    const globalSearchResults = document.getElementById('global-search-results');
    const codeInput = document.getElementById('code-input');
    
    const mainHeader = document.getElementById('main-header');
    const searchActionBtn = document.getElementById('search-action-btn');
    const searchBackBtn = document.getElementById('search-back-btn');

    // --- INICIO ---
    function initApp() {
        if(!window.location.hash) window.location.hash = "home";
        
        // Cargar estado del switch
        const savedState = localStorage.getItem('myApp_restrictedMode');
        if (savedState === 'true') {
            isRestrictedMode = true;
            library = privateLibrary;
        } else {
            library = publicLibrary;
        }
        
        const toggleBtn = document.getElementById('restriction-toggle');
        if(toggleBtn) toggleBtn.checked = isRestrictedMode;

        window.addEventListener('hashchange', handleRouting);
        handleRouting();
        
        setupTouchControls();

        searchActionBtn.addEventListener('click', shakeSearch);
        searchBackBtn.addEventListener('click', closeSearch);

        // [NUEVO] Listener para activar el flag de autoplay después del primer play manual.
        mainVideo.addEventListener('play', () => {
            if (!hasPlayedAnyVideo) {
                hasPlayedAnyVideo = true;
            }
        });

    // --- EVENTOS DE CARGA (SPINNER) ---
    mainVideo.addEventListener('loadstart', () => videoLoader.style.display = 'block'); // Al empezar a cargar
    mainVideo.addEventListener('waiting', () => videoLoader.style.display = 'block');   // Si se detiene por buffer
    mainVideo.addEventListener('canplay', () => videoLoader.style.display = 'none');   // Cuando ya puede reproducir
    mainVideo.addEventListener('playing', () => videoLoader.style.display = 'none');   // Cuando ya está reproduciendo
    mainVideo.addEventListener('error', () => videoLoader.style.display = 'none');     // Si hay error
    }

    function shakeSearch() {
        const searchInputs = document.querySelectorAll('.header-search-input');
        searchInputs.forEach(input => {
            input.classList.add('shake');
            setTimeout(() => input.classList.remove('shake'), 700);
        });
    }

    function openSearch() {
        mainHeader.classList.add('search-active');
        headerSearchInput.focus();
    }

    function closeSearch() {
        mainHeader.classList.remove('search-active');
        document.querySelectorAll('.header-search-input').forEach(el => el.value = ""); // Limpiar todos los inputs
        handleGlobalSearch(); // Limpiar resultados
    }

    function handleRouting() {
        const hash = window.location.hash;
        
        // Reset nav active state
        // document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

        if (hash.startsWith('#detail') && currentAnime) {
            showDetailView();
        } else if (hash === '#fulllist') {
            showFullListView();
        } else {
            showHomeView();
        }
    }

    function switchTab(tab) {
        const hash = '#' + tab;
        if (window.location.hash !== hash) {
            history.replaceState(null, null, hash);
            handleRouting();
        }
    }

    function toggleAppMode() {
        // Si ya estamos en modo privado, al tocar el icono se vuelve al modo público.
        if (isRestrictedMode) {
            isRestrictedMode = false;
            library = publicLibrary;
            localStorage.setItem('myApp_restrictedMode', 'false');
            renderHome();
            switchTab('home');
            return;
        }

        // Si estamos en modo público, verificar el código.
        if (codeInput.value === SECRET_CODE) {
            isRestrictedMode = true;
            library = privateLibrary;
            localStorage.setItem('myApp_restrictedMode', 'true');
            renderHome();
            switchTab('home');
        } else {
            // Código incorrecto: animar y limpiar.
            codeInput.classList.add('shake');
            setTimeout(() => codeInput.classList.remove('shake'), 700);
            codeInput.value = "";
        }
    }

    // --- RENDERIZADO ---
    function renderHome() {
        const homeContent = document.querySelector('.home-content');
        
        if (isRestrictedMode) {
            // --- MODO PRIVADO (GRID PAGINADO) ---
            // "Donde está el icono de huella... videos de 2 hasta abajo... hasta 10 lineas"
            homeContent.innerHTML = `
                <div class="full-list-grid" id="private-grid" style="padding-top:20px;"></div>
                <div id="private-pagination" class="pagination-container"></div>
            `;
            renderPrivateGrid();
        } else {
            // --- MODO PÚBLICO (LISTAS HORIZONTALES) ---
            homeContent.innerHTML = `
                <div class="section-title">Recientes</div>
                <div class="horizontal-list" id="recent-list"></div>

                <div class="section-title">Reciente en Series</div>
                <div class="horizontal-list" id="series-list"></div>

                <div class="section-title">Más populares</div>
                <div class="horizontal-list" id="popular-list"></div>
            `;

            // 1. Recién añadidos
            const recentContainer = document.getElementById('recent-list');
            // Usamos directamente la lista del archivo recientes.js
            let recentItems = typeof recientesData !== 'undefined' ? recientesData : [];
            
            recentItems.forEach(anime => {
                const card = document.createElement('div');
                card.className = "horizontal-item"; 
                card.onclick = () => { openAnimeDetail(anime); };
                card.innerHTML = `
                    <div class="poster"><img src="${anime.poster}" alt="${anime.titulo}"></div>
                    <div class="anime-title">${anime.titulo}</div>
                `;
                recentContainer.appendChild(card);
            });

            // 2. Más populares
            const popularContainer = document.getElementById('popular-list');
            // Usamos directamente la lista del archivo populares.js
            let popularItems = typeof popularesData !== 'undefined' ? popularesData : [];
            
            popularItems.forEach(anime => {
                const card = document.createElement('div');
                card.className = "horizontal-item"; 
                card.onclick = () => { openAnimeDetail(anime); };
                card.innerHTML = `
                    <div class="poster"><img src="${anime.poster}" alt="${anime.titulo}"></div>
                    <div class="anime-title">${anime.titulo}</div>
                `;
                popularContainer.appendChild(card);
            });

            // 3. Reciente en Series
            const seriesContainer = document.getElementById('series-list');
            // Usamos directamente la lista del archivo series.js
            let seriesItems = typeof seriesData !== 'undefined' ? seriesData : [];
            
            seriesItems.forEach(anime => {
                const card = document.createElement('div');
                card.className = "horizontal-item"; 
                card.onclick = () => { openAnimeDetail(anime); };
                card.innerHTML = `
                    <div class="poster"><img src="${anime.poster}" alt="${anime.titulo}"></div>
                    <div class="anime-title">${anime.titulo}</div>
                `;
                seriesContainer.appendChild(card);
            });
        }
    }

    function renderPrivateGrid() {
        const grid = document.getElementById('private-grid');
        const pagination = document.getElementById('private-pagination');
        if(!grid) return;

        // Calcular items de la página actual
        const start = (privatePage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const items = library.slice(start, end);

        grid.innerHTML = "";
        items.forEach(anime => {
            const card = document.createElement('div');
            card.className = "poster-wrapper"; 
            card.onclick = () => { openAnimeDetail(anime); };
            card.innerHTML = `
                <div class="poster"><img src="${anime.poster}" alt="${anime.titulo}"></div>
                <div class="anime-title">${anime.titulo}</div>
            `;
            grid.appendChild(card);
        });

        // Renderizar controles de paginación (1, 2, 3...)
        pagination.innerHTML = "";
        const totalPages = Math.ceil(library.length / itemsPerPage);
        
        if(totalPages > 1) {
            for(let i=1; i<=totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === privatePage ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => {
                    privatePage = i;
                    renderPrivateGrid();
                    window.scrollTo(0,0);
                };
                pagination.appendChild(btn);
            }
        }
    }

    function renderGrid(data, container) {
        container.innerHTML = "";
        data.forEach(anime => {
            const card = document.createElement('div');
            card.className = "poster-wrapper"; 
            card.onclick = () => { openAnimeDetail(anime); };
            card.innerHTML = `
                <div class="poster"><img src="${anime.poster}" alt="${anime.titulo}"></div>
                <div class="anime-title">${anime.titulo}</div>
            `;
            container.appendChild(card);
        });
    }

    // --- DETALLE ---
    function openAnimeDetail(anime) {
        hasPlayedAnyVideo = false; 
        currentAnime = anime;
        currentEpIndex = 0;
        prepareDetailView(anime);
        window.location.hash = "detail";
    }
    
    function prepareDetailView(anime) {
        detailTitle.innerText = anime.titulo;
        detailSubtitle.innerText = anime.titulo_jp || "";

        detailRating.innerText = anime.rating || "";
        detailSeason.innerText = anime.temporada || "";
        detailYear.innerText = anime.ano || "";
        detailQuality.innerText = anime.calidad || "";
        
        detailSynopsis.innerText = anime.sinopsis || "";

        epSelector.innerHTML = "";
        const totalEps = anime.episodios.length;
        epCountText.innerText = `${totalEps} ${totalEps === 1 ? 'Capítulo' : 'Capítulos'}`;

        anime.episodios.forEach((ep, index) => {
            const btn = document.createElement('div');
            btn.className = 'ep-box';
            btn.innerText = ep.num;
            btn.onclick = () => playEpisode(index);
            epSelector.appendChild(btn);
        });

        // Forzar el scroll al inicio DESPUÉS de agregar los botones
        epSelector.scrollLeft = 0;

        if (totalEps > 0) {
            playEpisode(0);
        } else {
            videoContainer.style.display = 'none';
            heroImg.style.display = 'block';
            heroImg.src = anime.banner || anime.poster;
        }
    }

    function playEpisode(index, isAutoChained = false) {
        if (!currentAnime || !currentAnime.episodios[index]) return;
        currentEpIndex = index;
        const episode = currentAnime.episodios[index];

        // Primero, revisamos si la app de Android nos está "escuchando".
        if (typeof Android !== 'undefined' && Android.playVideo) {
            // Si es así, le pasamos las URLs al código nativo de Java.
            const videoLink = episode.link;
            const subtitleLink = episode.subtitulo || null; // Si no hay subtitulo, pasamos null

            if (subtitleLink) {
                Android.playVideo(videoLink, subtitleLink);
            } else {
                Android.playVideo(videoLink);
            }
            
        } else {
            // Si no estamos en la app, usamos el reproductor web personalizado.
            console.log("Interfaz 'Android' no encontrada. Usando reproductor web.");
            heroImg.style.display = "none";
            videoContainer.style.display = "block"; // Mostrar el contenedor del nuevo reproductor
            if (episode.thumb) {
                mainVideo.poster = episode.thumb;
            } else {
                mainVideo.removeAttribute("poster");
            }
            mainVideo.src = episode.link;
            mainVideo.load(); // Forzar al navegador a procesar el nuevo video inmediatamente
            mainVideo.preload = "auto"; // Forzar precarga inmediata
            
            mainVideo.currentTime = 0;
            // Reiniciar barra de progreso
            progressBar.style.width = '0%';
            progressKnob.style.left = '0%';
            
            // Cargar Sprite si existe
            loadSprite(episode.sprite, episode.spriteImg);

            // Lógica de reproducción y estado de UI
            if (isAutoChained || hasPlayedAnyVideo) {
                mainVideo.play();
                videoContainer.classList.remove('paused');
                btnCenter.innerHTML = iconPause;
            } else {
                // Forzar estado pausado en carga manual inicial
                mainVideo.pause();
                videoContainer.classList.add('paused');
                btnCenter.innerHTML = iconPlay;
            }
            
            // Cargar subtítulos para el reproductor web
            if (octopusInstance) { octopusInstance.freeTrack(); octopusInstance = null; }
            setupSubtitles(episode.subtitulo);
        }

        // El resto de la función para actualizar la UI se mantiene.
        const buttons = epSelector.querySelectorAll('.ep-box');
        buttons.forEach((btn, i) => {
            btn.classList.toggle('active', i === index);
        });
        
        if(buttons[index]) {
            buttons[index].scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
        }

        if (!isAutoChained) {
            document.getElementById('hero-area').scrollIntoView({ behavior: 'smooth' });
        }
    }

    // --- LÓGICA DEL REPRODUCTOR PERSONALIZADO ---
    let octopusInstance = null;
    let currentSubUrl = 'none';
    let subtitlePreference = 'none'; // [NUEVO] Variable para recordar la elección

    // 1. Play/Pausa
    const iconPlay = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    const iconPause = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

    const togglePlay = (e) => {
        e.stopPropagation();
        if (mainVideo.paused) {
            mainVideo.play();
            btnCenter.innerHTML = iconPause;
            videoContainer.classList.remove('paused');
            showControls();
        } else {
            mainVideo.pause();
            btnCenter.innerHTML = iconPlay;
            videoContainer.classList.add('paused');
            showControls();
        }
    };
    btnCenter.addEventListener('click', togglePlay);

    // 2. Mostrar/Ocultar Controles
    let controlsTimer;

    const showControls = () => {
        videoContainer.classList.add('active');
        clearTimeout(controlsTimer);
        controlsTimer = setTimeout(() => {
            // No ocultar si el video está pausado o si se está arrastrando la barra
            if (!mainVideo.paused && !isScrubbing) {
                videoContainer.classList.remove('active');
            }
        }, 3000);
    };
    
    videoContainer.addEventListener('click', (e) => {
        // Ignorar si el clic proviene de controles internos (aunque la mayoría detiene la propagación, es doble seguridad)
        if (e.target.closest('.bottom-bar') || e.target.closest('.cc-menu') || e.target.closest('.progress-container')) return;
        
        // Lógica inteligente para el botón Play central
        if (e.target.closest('.center-play')) {
            // Si acabamos de pausar, mantener los controles visibles
            if (mainVideo.paused) return;
            // Si acabamos de dar play, dejar que el código de abajo oculte los controles
        }

        if (videoContainer.classList.contains('active')) {
            videoContainer.classList.remove('active');
            clearTimeout(controlsTimer);
        } else {
            showControls();
        }
    });
    
    // 3. Barra de Progreso
    const formatTime = s => {
        if (isNaN(s)) return "0:00";
        const m = Math.floor(s/60);
        const sc = Math.floor(s%60);
        return `${m}:${sc<10?'0':''}${sc}`;
    };
    mainVideo.addEventListener('loadedmetadata', () => durTimeText.textContent = formatTime(mainVideo.duration));
    
    mainVideo.addEventListener('timeupdate', () => {
        if (isScrubbing) return;
        const pct = (mainVideo.currentTime / mainVideo.duration) * 100;
        progressBar.style.width = `${pct}%`;
        progressKnob.style.left = `${pct}%`;
        currTimeText.textContent = formatTime(mainVideo.currentTime);
    });
    
    // --- LÓGICA DE SPRITES ---
    let spriteData = [];
    let spriteTotalWidth = 0;
    let spriteTotalHeight = 0;

    function loadSprite(url, imgOverride) {
        spriteData = [];
        spriteTotalWidth = 0;
        spriteTotalHeight = 0;
        if (!url) return;
        
        // Obtener la ruta base del archivo VTT para resolver imágenes relativas
        const lastSlash = url.lastIndexOf('/');
        const baseUrl = lastSlash !== -1 ? url.substring(0, lastSlash + 1) : '';

        fetch(url)
            .then(r => r.text())
            .then(text => {
                const lines = text.split('\n');
                // Corregido: Regex flexible para soportar MM:SS.mmm y HH:MM:SS.mmm
                const timeRegex = /(?:(\d{2}):)?(\d{2}):(\d{2})\.(\d{3})/;
                const parseTime = (t) => {
                    const parts = t.match(timeRegex);
                    if(!parts) return 0;
                    const h = parts[1] ? parseInt(parts[1]) : 0;
                    const m = parseInt(parts[2]);
                    const s = parseInt(parts[3]);
                    const ms = parseInt(parts[4]);
                    return h*3600 + m*60 + s + ms/1000;
                };
                
                let currentStart = 0;
                let currentEnd = 0;
                
                for(let i=0; i<lines.length; i++) {
                    const line = lines[i].trim();
                    if(line.includes('-->')) {
                        const times = line.split('-->');
                        currentStart = parseTime(times[0].trim());
                        currentEnd = parseTime(times[1].trim());
                    } else if (line.includes('#xywh=')) {
                        let [imgUrl, coords] = line.split('#xywh=');
                        
                        if (imgOverride) {
                            imgUrl = imgOverride;
                        } else if (imgUrl && !imgUrl.includes('://') && !imgUrl.startsWith('data:')) {
                            imgUrl = baseUrl + imgUrl;
                        }

                        const [x, y, w, h] = coords.split(',');
                        spriteData.push({ start: currentStart, end: currentEnd, url: imgUrl, x, y, w, h });
                    }
                }

                // Precargar imagen para obtener dimensiones totales (necesario para el escalado HD)
                if (spriteData.length > 0) {
                    const img = new Image();
                    img.src = spriteData[0].url;
                    img.onload = () => {
                        spriteTotalWidth = img.naturalWidth;
                        spriteTotalHeight = img.naturalHeight;
                    };
                }
            })
            .catch(e => console.error("Error loading sprite:", e));
    }

    // Función para actualizar la miniatura
    const updatePreview = (clientX) => {
        // Si no hay sprites cargados, no mostrar el cuadro de vista previa
        if (spriteData.length === 0) {
            previewBox.style.display = 'none';
            return;
        }

        const rect = progressArea.getBoundingClientRect();
        let pos = (clientX - rect.left) / rect.width;
        pos = Math.max(0, Math.min(1, pos));
        const time = pos * mainVideo.duration;

        // Posición visual (clamp para que no se salga de la pantalla)
        const boxWidth = 160; 
        const visualX = Math.max(boxWidth/2, Math.min(rect.width - boxWidth/2, pos * rect.width));
        
        previewBox.style.left = `${visualX}px`;
        previewBox.style.display = 'block';

        // Mostrar sprite si existe datos
        if (spriteData.length > 0) {
            const cue = spriteData.find(c => time >= c.start && time < c.end);
            if (cue) {
                previewImg.style.display = 'block';
                previewImg.style.backgroundImage = `url(${cue.url})`;
                
                const spriteW = parseFloat(cue.w);
                // Auto-escalado: Si el sprite es más grande que la caja (160px), lo reducimos proporcionalmente
                if (spriteTotalWidth > 0 && spriteW > 160) {
                    const scale = 160 / spriteW;
                    const bgW = spriteTotalWidth * scale;
                    const bgH = spriteTotalHeight * scale;
                    const bgX = parseFloat(cue.x) * scale;
                    const bgY = parseFloat(cue.y) * scale;
                    
                    previewImg.style.backgroundSize = `${bgW}px ${bgH}px`;
                    previewImg.style.backgroundPosition = `-${bgX}px -${bgY}px`;
                } else {
                    // Tamaño nativo (160px o menor)
                    previewImg.style.backgroundSize = 'auto';
                    previewImg.style.backgroundPosition = `-${cue.x}px -${cue.y}px`;
                }
            } else {
                previewImg.style.display = 'none';
            }
        } else {
            previewImg.style.display = 'none';
        }
    };

    let scrubTargetTime = null;

    const scrub = (e) => {
        const rect = progressArea.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX; 
        let pos = (clientX - rect.left) / rect.width;
        pos = Math.max(0, Math.min(1, pos));
        
        const pct = pos * 100;
        progressBar.style.width = `${pct}%`;
        progressKnob.style.left = `${pct}%`;
        
        if (mainVideo.duration) {
            scrubTargetTime = pos * mainVideo.duration;
            currTimeText.textContent = formatTime(scrubTargetTime);
        }
        updatePreview(clientX); // Mostrar miniatura al arrastrar
    };
    
    let isScrubbing = false;
    
    const startScrub = (e) => { 
        isScrubbing = true; 
        showControls();
        scrub(e); 
    };
    const moveScrub = (e) => { 
        if (isScrubbing) { 
            e.preventDefault(); 
            showControls();
            scrub(e); 
        } 
    };
    const endScrub = () => { 
        if (!isScrubbing) return;
        isScrubbing = false; 
        previewBox.style.display = 'none'; 
        if (scrubTargetTime !== null) {
            mainVideo.currentTime = scrubTargetTime;
            scrubTargetTime = null;
        }
        showControls();
    };

    progressArea.addEventListener('mousedown', startScrub);
    progressArea.addEventListener('touchstart', startScrub, { passive: false });
    
    // Eventos para Hover (PC)
    progressArea.addEventListener('mousemove', (e) => updatePreview(e.clientX));
    progressArea.addEventListener('mouseleave', () => previewBox.style.display = 'none');
    
    document.addEventListener('mousemove', moveScrub);
    document.addEventListener('touchmove', moveScrub, { passive: false });
    
    document.addEventListener('mouseup', endScrub);
    document.addEventListener('touchend', endScrub);

    // 4. Subtítulos
    function setupSubtitles(subUrl) {
        // Ocultar menú
        ccMenu.style.display = 'none';
        ccMenu.innerHTML = '';
        currentSubUrl = 'none';
        btnCC.classList.remove('cc-active');

        // Evitar error si la librería de subtítulos no cargó (offline o bloqueo)
        if (typeof SubtitlesOctopus === 'undefined') return;

        // Función auxiliar para cargar
        const loadSub = (url) => {
            if (!octopusInstance) {
                octopusInstance = new SubtitlesOctopus({
                    video: mainVideo,
                    subUrl: url,
                    fonts: ['https://todesvip.github.io/visor-manga/fonts/Arial.woff2'], 
                    workerUrl: 'https://todesvip.github.io/visor-manga/assets/js/subtitles-octopus-worker.js' 
                });
            } else {
                octopusInstance.setTrackByUrl(url);
            }
        };

        // Opción None
        const noneBtn = document.createElement('button');
        noneBtn.textContent = 'None';
        // La clase active se gestiona en updateCCMenu
        noneBtn.onclick = () => {
            subtitlePreference = 'none'; // Guardar preferencia
            if (octopusInstance) octopusInstance.freeTrack();
            updateCCMenu('none');
        };
        ccMenu.appendChild(noneBtn);

        if (subUrl) {
            const subBtn = document.createElement('button');
            subBtn.textContent = 'Español';
            subBtn.onclick = () => {
                subtitlePreference = 'Español'; // Guardar preferencia
                loadSub(subUrl);
                updateCCMenu(subUrl);
            };
            ccMenu.appendChild(subBtn);

            // Auto-activar si la preferencia es Español
            if (subtitlePreference === 'Español') {
                loadSub(subUrl);
                updateCCMenu(subUrl);
            } else {
                updateCCMenu('none');
            }
        } else {
            updateCCMenu('none');
        }
    }

    function updateCCMenu(activeUrl) {
        currentSubUrl = activeUrl;
        btnCC.classList.toggle('cc-active', activeUrl !== 'none');
        Array.from(ccMenu.children).forEach(btn => {
            btn.classList.toggle('active', (btn.textContent === 'None' && activeUrl === 'none') || (btn.textContent === 'Español' && activeUrl !== 'none'));
        });
        ccMenu.style.display = 'none';
    }

    btnCC.addEventListener('click', (e) => {
        e.stopPropagation();
        ccMenu.style.display = ccMenu.style.display === 'block' ? 'none' : 'block';
    });

    // 5. Fullscreen
    btnFS.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!document.fullscreenElement) {
            if (videoContainer.requestFullscreen) videoContainer.requestFullscreen();
            else if (videoContainer.webkitRequestFullscreen) videoContainer.webkitRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
    });

    // --- Control por gestos ---
    let isDragging = false;
    let startX = 0;
    let startVideoTime = 0;
    // [CORREGIDO] Se aumenta el valor para que el deslizamiento sea mucho más rápido.
    const swipeSeekFactor = 2.5; 
    let lastSeekTimestamp = 0; // Variable para controlar la frecuencia

    function setupTouchControls() {
        // heroArea.addEventListener('touchstart', handleTouchStart); // Desactivado para no interferir con el nuevo reproductor
        // heroArea.addEventListener('touchmove', handleTouchMove, { passive: false }); // Desactivado para no interferir con el nuevo reproductor
        // heroArea.addEventListener('touchend', handleTouchEnd); // Desactivado para no interferir con el nuevo reproductor
    }
    
    function handleTouchStart(e) {
        if (mainVideo.paused || !mainVideo.duration) return;
        isDragging = true;
        startX = e.touches[0].clientX;
        startVideoTime = mainVideo.currentTime;
        lastSeekTimestamp = 0;
    }

    function handleTouchMove(e) {
        if (!isDragging) return;
        e.preventDefault(); 

        // Evitar que se actualice demasiadas veces por segundo (evita el bug de congelamiento)
        const now = Date.now();
        if (now - lastSeekTimestamp < 50) return; 
        lastSeekTimestamp = now;

        const currentX = e.touches[0].clientX;
        const deltaX = currentX - startX;
        
        const timeOffset = deltaX * swipeSeekFactor;
        let newTime = startVideoTime + timeOffset;

        newTime = Math.max(0, Math.min(mainVideo.duration, newTime));
        
        mainVideo.currentTime = newTime;
    }

    function handleTouchEnd(e) {
        if (!isDragging) return;
        isDragging = false;
    }


    // --- UTILIDADES ---
    function showDetailView() {
        document.getElementById('main-header').style.transform = 'translateY(-100%)'; // Ocultar header en reproductor
        switchView(detailView);
        window.scrollTo(0, 0);
    }

    function showHomeView() {
        mainVideo.pause();
        mainVideo.src = "";
        videoContainer.style.display = 'none'; // Ocultar reproductor
        currentAnime = null; 
        switchView(homeView);
        document.getElementById('main-header').style.transform = 'translateY(0)'; // Mostrar header
        renderHome(); // Recargar para actualizar "Continuar viendo"
        if(window.location.hash !== '#home') history.replaceState(null, null, '#home');
    }

    function showSettingsView() {
        switchView(settingsView);
        document.getElementById('main-header').style.transform = 'translateY(0)';
    }

    function switchView(view) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        view.classList.add('active');
    }

    // --- LISTA COMPLETA ---
    function openFullList() {
        renderGrid(library, fullGrid);
        window.location.hash = "fulllist";
    }
    function showFullListView() {
        renderGrid(library, fullGrid);
        document.getElementById('main-header').style.transform = 'translateY(0)';
        switchView(fullListView);
    }
    function closeFullList() {
        window.history.back();
    }

    function handleGlobalSearch(sender) {
        const input = sender || headerSearchInput;
        const query = input.value.toLowerCase().trim();
        
        if (!query) {
            globalSearchResults.style.display = 'none';
            return;
        }

        const filtered = library.filter(a => a.titulo.toLowerCase().includes(query));
        globalSearchResults.innerHTML = "";
        globalSearchResults.style.display = 'block';

        filtered.forEach(anime => {
            const item = document.createElement('div');
            item.className = 'search-result-card';
            item.innerHTML = `
                <img src="${anime.poster}" class="search-poster-img">
                <div class="search-info">
                    <div class="search-title">${anime.titulo}</div>
                    <div class="search-desc">${anime.sinopsis || 'Sin descripción.'}</div>
                </div>
            `;
            item.onclick = () => {
                globalSearchResults.style.display = 'none';
                document.querySelectorAll('.header-search-input').forEach(el => el.value = "");
                openAnimeDetail(anime);
            };
            globalSearchResults.appendChild(item);
        });

        if (filtered.length === 0) {
            globalSearchResults.innerHTML = "<div style='padding:20px; color:#888; text-align:center;'>No se encontraron resultados</div>";
        }
    }

    // El listener para el final del video ahora llama a playEpisode con el segundo parámetro en 'true'
    mainVideo.addEventListener('ended', () => {
        if (currentAnime && currentEpIndex < currentAnime.episodios.length - 1) {
            playEpisode(currentEpIndex + 1, true);
        }
    });

    initApp();
    
    // --- LOGICA DE INICIO (SPLASH SCREEN) ---
    async function launchApp() {
        const splash = document.getElementById('splash-screen');
        const status = document.getElementById('splash-status');
        const spinner = document.getElementById('splash-spinner');
        const retryBtn = document.getElementById('retry-btn');

        // 1. Verificar conexión básica
        if (!navigator.onLine) {
            showError("Sin conexión a internet");
            return;
        }

        // 2. Precargar imágenes
        try {
            
            // Recolectar imágenes
            const imagesToLoad = [];
            library.forEach(anime => {
                if(anime.poster) imagesToLoad.push(anime.poster);
                if(anime.banner) imagesToLoad.push(anime.banner);
            });

            // Crear promesas de carga
            const loadPromises = imagesToLoad.map(src => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.src = src;
                    img.onload = resolve;
                    img.onerror = resolve; // Continuar aunque falle una imagen específica
                });
            });

            // Esperar a que carguen (o timeout de 8s)
            await Promise.race([
                Promise.all(loadPromises),
                new Promise(resolve => setTimeout(resolve, 8000))
            ]);

            // 3. Transición al Home
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
            }, 500);

        } catch (e) {
            console.error("Error en carga:", e);
            // En caso de error inesperado, dejar entrar
            splash.style.display = 'none';
        }

        function showError(msg) {
            spinner.style.display = 'none';
            status.innerText = msg;
            status.style.display = 'block';
            status.style.color = '#ff4444';
            retryBtn.style.display = 'block';
        }
    }

    // Ejecutar carga
    launchApp();

</script>
