<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Void</title>
    <!-- Librería de subtítulos -->
    <script src="https://todesvip.github.io/visor-manga/assets/js/subtitles-octopus.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- OPTIMIZACIÓN: Preconectar a servidores para que el video inicie antes -->

    <style>
        /* --- ESTILOS GENERALES --- */
        :root { --bg: #000000; --text: #ffffff; --text-gray: #6b7280; --accent: #e63946; --glow: rgba(230,57,70,0.35); --surface2: #12141f; --border: rgba(255,255,255,0.07); --font-mono: 'Space Mono', monospace; }
        
        /* --- ELIMINAR SOMBRA DE CONTROLES DE VIDEO --- */
        video::-webkit-media-controls-panel {
            background-image: none !important;
        }
        /* --------------------------------------------- */        
        body { 
            margin: 0; padding: 0; 
            background-color: var(--bg); color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Evitar arrastrar imágenes al deslizar en móvil */
        img {
            -webkit-user-drag: none;
            -webkit-user-select: none;
            user-select: none;
            pointer-events: none;
        }

        .view { display: none; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

        /* --- CARRUSEL HERO --- */
        .hero-carousel {
            position: relative;
            width: 100%;
            height: 58vw;
            min-height: 240px;
            max-height: 380px;
            overflow: hidden;
            background: #000;
        }
        .hero-slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.7s ease;
            cursor: pointer;
            pointer-events: none;
        }
        .hero-slide.active { opacity: 1; pointer-events: auto; }

        .hero-slide-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center top;
            transform: scale(1.05);
            transition: transform 7s ease-out;
        }
        .hero-slide.active .hero-slide-bg { transform: scale(1); }

        .hero-gradient {
            position: absolute;
            inset: 0;
            background: 
                linear-gradient(to right, rgba(7,8,13,0.92) 0%, rgba(7,8,13,0.4) 60%, transparent 100%),
                linear-gradient(to top, var(--bg) 0%, transparent 40%);
        }

        .hero-content {
            position: absolute;
            bottom: 20px;
            left: 16px;
            right: 40%;
        }
        .hero-genre-tag {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-gray);
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 3px 8px;
            margin-bottom: 0;
            border-radius: 4px;
        }
        .hero-title {
            font-family: var(--font-mono);
            font-size: clamp(1.2rem, 4.5vw, 1.8rem);
            line-height: 1.2;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .hero-logo {
            max-width: 70%;
            max-height: 80px;
            margin-bottom: 10px;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.7));
        }
        .hero-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-family: var(--font-mono);
            font-size: 0.58rem;
        }

        .hero-description {
            font-size: 12px;
            color: #ccc;
            line-height: 1.4;
            margin-top: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* Limitar a 2 líneas */
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }
        
        .hero-year-text {
            color: #ffffff;
            font-size: 13px; 
            font-weight: 600; 
            font-variant-numeric: tabular-nums;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Indicadores carrusel */
        .hero-dots {
            position: absolute;
            bottom: 10px;
            right: 16px;
            display: flex;
            gap: 5px;
        }
        .hero-dot {
            width: 18px;
            height: 2px;
            background: var(--glow);
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .hero-dot.active {
            width: 28px;
            background: var(--accent);
            box-shadow: 0 0 6px var(--accent);
        }

        .header-search-input {
            width: 100%; max-width: 300px;
            flex-grow: 1; /* Ocupa el espacio restante */
            background-color: #1e1e24;
            color: #ccc;
            border: none; border-radius: 8px;
            padding: 8px 12px; font-size: 14px; font-weight: 500;
            outline: none; transition: width 0.3s;
        }
        .header-search-input::placeholder { color: #888; }
        .header-search-input.shake { animation: shake 0.7s cubic-bezier(.36,.07,.19,.97) both; }

        /* Ocultar flechas en input de número */
        input[type=number]::-webkit-outer-spin-button, 
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .settings-code-input {
            text-align: center; letter-spacing: 2px;
        }

        /* --- BOTÓN LUPA FLOTANTE (TOP) --- */
        .top-search-btn {
            position: absolute;
            top: 5px;
            right: 10px;
            z-index: 20;
            width: 40px;
            height: 40px;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none;
        }
        .top-search-btn svg { width: 28px; height: 28px; fill: white; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.8)); }

        /* --- PANTALLA DE BÚSQUEDA (OVERLAY) --- */
        .search-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg);
            z-index: 100;
            flex-direction: column;
        }
        .search-overlay.active { display: flex; }
        
        .search-header-bar {
            display: flex; align-items: center; padding: 15px; gap: 15px;
            background-color: #101010; border-bottom: none;
            position: relative; /* Necesario para el menú desplegable */
        }
        .search-back-btn {
            background: none; border: none; padding: 0; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .search-back-btn svg { width: 32px; height: 32px; fill: white; }

        /* --- RESULTADOS DE BÚSQUEDA (TEXTO) --- */
        #global-search-results {
            width: 100%; flex: 1;
            background: transparent;
            overflow-y: auto; display: none;
            padding: 10px 0;
        }
        .search-result-card {
            display: flex; gap: 15px; padding: 15px;
            border-bottom: none;
            cursor: pointer; transition: background 0.2s;
        }
        .search-result-card:hover { background: #1a1a1a; }
        .search-poster-img {
            width: 100px; aspect-ratio: 2/3; object-fit: cover; 
            border-radius: 0; flex-shrink: 0;
        }
        .search-info {
            display: flex; flex-direction: column; justify-content: center;
        }
        .search-title {
            color: #ffffff; font-size: 15px; font-weight: 700; margin-bottom: 5px;
        }
        .search-desc {
            color: #ccc; font-size: 11px; line-height: 1.4;
            display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
        }

        /* --- NUEVO HOME (HORIZONTAL) --- */
        .section-title {
            font-size: 16px; font-weight: 600; margin: 15px 0 10px 0; padding-left: 20px; color: #ffffff;
            letter-spacing: 0px;
        }

        .home-content { padding-top: 0; }

        .horizontal-list {
            display: flex; overflow-x: auto; gap: 10px; padding: 0;
            scroll-padding-left: 20px; /* Para que el snap se alinee con el título */
            scrollbar-width: none; margin-bottom: 25px;
            scroll-snap-type: x mandatory;
        }
        
        /* Espaciadores para alinear */
        .horizontal-list::before, .horizontal-list::after {
            content: ''; display: block; flex: 0 0 10px;
        }

        #recent-list { padding-left: 0; }

        .horizontal-list::-webkit-scrollbar { display: none; }
        
        .horizontal-item { flex: 0 0 130px; cursor: pointer; scroll-snap-align: start; transition: transform 0.2s; }
        .horizontal-item:active { transform: scale(0.95); }

        @media (max-width: 600px) {
            .horizontal-item { flex: 0 0 33vw; }
        }

        .view-all-btn {
            display: none; /* Se oculta por defecto, se activa con JS si > 10 */
            width: calc(100% - 30px); margin: 0 auto 30px;
            padding: 12px; background: #1e1e24; border: 1px solid #333;
            color: var(--accent); border-radius: 8px; font-weight: 600; cursor: pointer;
            text-align: center; font-size: 14px;
        }

        /* --- DIRECTORIO (GRID TIPO SASA) --- */
        .directory-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            padding: 20px 15px;
        }
        .dir-card {
            background-color: #1e1e24; border-radius: 16px; height: 100px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-decoration: none; color: white; position: relative; cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .dir-card:active { transform: scale(0.96); background-color: #25252b; }
        
        .dir-icon {
            width: 28px; height: 28px; margin-bottom: 8px;
            fill: var(--accent);
        }
        .dir-title {
            font-size: 14px; font-weight: 700; margin-bottom: 2px;
        }
        .dir-subtitle {
            font-size: 11px; color: var(--text-gray);
        }

        /* --- LISTA COMPLETA (GRID 2 COLUMNAS) --- */
        .full-list-grid {
            padding: 20px 15px;
            display: grid; grid-template-columns: 1fr 1fr; 
            gap: 15px;
        }
        .poster-wrapper { cursor: pointer; }
        .poster {
            width: 100%; aspect-ratio: 2/3; border-radius: 0; overflow: hidden; background: #1a1a1a;
            margin-bottom: 8px;
        }
        .poster img { width: 100%; height: 100%; object-fit: cover; }
        .anime-title { font-size: 13px; font-weight: 500; color: #ddd; }

        /* --- DETALLE --- */
        .hero-container {
            position: relative; width: 100%; aspect-ratio: 16/9; background: #000;
        }
        .hero-bg { width: 100%; height: 100%; object-fit: cover; display: none; } 
        
        /* --- REPRODUCTOR AVANZADO (INTEGRACIÓN) --- */
        #video-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; z-index: 30; display: none; /* Oculto por defecto */
            pointer-events: auto;
        }
        
        #main-video { 
            width: 100%; height: 100%; display: block; object-fit: contain; position: relative; z-index: 0; pointer-events: none;
            /* FORZAR ACELERACIÓN DE HARDWARE (Hace que vaya más fluido en Android) */
            transform: translate3d(0, 0, 0); will-change: transform;
            background-color: #000; /* Fondo negro para videos sin poster */
        }

        /* --- SPINNER CARGA VIDEO --- */
        .video-loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 25; pointer-events: none; display: none;
        }
        .video-spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* CAPA DE CONTROLES (OVERLAY) */
        .controls-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.5), transparent 25%, transparent 75%, rgba(0,0,0,0.5));
            opacity: 0; transition: opacity 0.3s;
            pointer-events: none;
            z-index: 20;
        }

        /* Mostrar controles cuando esté activo o pausado */
        #video-container.active .controls-overlay,
        #video-container.paused .controls-overlay { opacity: 1; pointer-events: none; }

        /* CONTENEDOR CENTRAL */
        .center-controls {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; align-items: center; gap: 20px;
            pointer-events: none;
        }

        /* BOTÓN PLAY GIGANTE CENTRAL */
        .center-play {
            position: relative; transform: none; top: auto; left: auto;
            width: 80px; height: 80px; background: none; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer; border: none;
            pointer-events: auto;
        }
        /* BOTONES SKIP */
        .skip-btn {
            width: 80px; height: 80px; background: none;
            display: flex; justify-content: center; align-items: center; cursor: pointer; border: none;
            pointer-events: auto;
        }
        .skip-btn svg { width: 48px; height: 48px; }

        .center-play svg {
            width: 48px; height: 48px; fill: white;
        }
        /* Ajuste visual solo para el ícono de Play (cuando está pausado) */
        #video-container.paused .center-play svg { margin-left: 4px; }

        /* BARRA SUPERIOR (NUEVO) */
        .top-bar {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 15px 20px; box-sizing: border-box;
            display: flex; justify-content: flex-end; align-items: center;
            pointer-events: none; z-index: 22;
        }

        /* BARRA INFERIOR */
        .bottom-bar {
            background: transparent;
            /* Contenedor para la fila de controles, se posiciona al fondo */
            position: absolute; bottom: 20px; /* Un poco más arriba para separar de la barra de progreso */
            left: 0; width: 100%;
            pointer-events: none;
        }

        /* FILA DE CONTROLES */
        .controls-row { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 20px; box-sizing: border-box; }

        /* TIEMPOS */
        .time-text { 
            color: #ffffff; /* Blanco puro para ambos tiempos */
            font-size: 13px; font-weight: 600; 
            font-variant-numeric: tabular-nums;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* BARRA DE PROGRESO */
        .progress-container {
            /* Se posiciona absolutamente en el borde inferior */
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 5px; /* Área táctil reducida */
            display: flex; align-items: flex-end; cursor: pointer;
            pointer-events: auto;
        }
        .progress-bg { width: 100%; height: 3px; background: rgba(255, 255, 255, 0.2); position: relative; }
        .progress-fill { height: 100%; width: 0%; background: white; position: absolute; top: 0; left: 0; }
        .progress-handle {
            width: 8px; height: 8px; background: white; border-radius: 50%;
            position: absolute; top: 50%; left: 0%; transform: translate(-50%, -50%);
            z-index: 5;
            transition: width .15s ease, height .15s ease;
        }
        .progress-container:active .progress-handle { width: 12px; height: 12px; }

        /* MINIATURA DE VISTA PREVIA */
        .preview-box {
            position: absolute; bottom: 20px; left: 0; transform: translateX(-50%);
            width: 160px; height: 90px; background: #000;
            border: none; border-radius: 0;
            display: none; overflow: hidden; pointer-events: none; z-index: 30;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .preview-box video {
            width: 100%; height: 100%; object-fit: cover; opacity: 0.8;
        }
        #preview-img {
            width: 100%; height: 100%;
            background-color: #000;
            background-repeat: no-repeat;
            display: none;
        }

        /* BOTONES DERECHA */
        .right-buttons { display: flex; gap: 10px; align-items: center; pointer-events: auto; }
        .icon-btn { background: none; border: none; cursor: pointer; padding: 5px; display: flex; justify-content: center; align-items: center; opacity: 0.8; transition: opacity 0.2s; }
        .icon-btn:hover { opacity: 1; }
        .icon-btn svg { width: 24px; height: 24px; fill: white; }
        
        /* MENÚ DE SUBTÍTULOS */
        .cc-menu-container { position: relative; }
        .cc-menu {
            display: none; position: absolute; top: 100%; right: 0; /* Abre hacia abajo ahora */
            background: rgba(18, 18, 18, 0.95); border-radius: 0;
            margin-top: 10px; min-width: 150px; z-index: 21;
            pointer-events: auto;
        }
        .cc-menu button {
            background: none; border: none; color: #ccc; font-size: 14px;
            padding: 10px 20px; width: 100%; text-align: left; cursor: pointer; display: block;
        }
        .cc-menu button:hover { background: rgba(255, 255, 255, 0.1); }
        .cc-menu button.active { font-weight: bold; color: #fff; background: rgba(255, 255, 255, 0.05); }
        
        /* CANVAS SUBTÍTULOS */
        #video-container canvas {
            position: absolute !important; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        .content-body { padding: 20px; position: relative; z-index: 25; background-color: var(--bg); }
        
        .show-title { 
            font-size: 18px; 
            font-weight: 800; 
            line-height: 1.2; 
            margin-bottom: 8px; 
            cursor: pointer; 
            color: #eee; letter-spacing: 0.5px;
            width: fit-content;
        }
        .show-title:active { opacity: 0.7; }

        .show-subtitle {
            font-size: 15px;
            color: var(--text-gray);
            margin-bottom: 12px;
            font-family: 'Noto Sans JP', sans-serif;
        }

        .meta-row { display: flex; gap: 10px; font-size: 13px; color: var(--text-gray); margin-bottom: 20px; align-items: center; }
        .badge { border: 1px solid var(--text-gray); padding: 1px 4px; border-radius: 2px; font-size: 11px; }

        /* --- SELECTOR DE EPISODIOS (CUADROS) --- */
        .ep-count-header {
            text-align: right; color: var(--text-gray); font-size: 12px; margin-bottom: 8px; font-weight: 500;
        }

        .ep-selector-row {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px;
            scrollbar-width: none; 
        }
        .ep-selector-row::-webkit-scrollbar { display: none; }

        .ep-box {
            width: 50px; height: 50px; 
            background: #1e1e24;
            border-radius: 8px; border: none;
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 1rem; color: #ccc; flex-shrink: 0;
            cursor: pointer; transition: transform 0.2s, background 0.2s;
            overflow: hidden;
        }
        .ep-box.active {
            background: #000000;
        }
        .ep-box:active { transform: none; }

        /* --- SINOPSIS --- */
        .synopsis { font-size: 13px; line-height: 1.5; color: #ccc; margin-bottom: 5px; }
        .read-more-btn {
            display: none !important;
        }

        /* Botón volver genérico */
        .back-btn {
            background: none; border: none; color: white; font-size: 16px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 5px;
        }

        /* Ajuste para que el contenido no quede tapado por el nav */
        .view { padding-bottom: 80px; }
        
        /* AJUSTES */
        .settings-content { padding: 20px; }
        .settings-title { font-size: 24px; font-weight: 700; margin-bottom: 30px; }
        .settings-section { background: #1a1a1a; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .settings-section-title { font-size: 16px; font-weight: 600; margin-bottom: 5px; }
        .settings-section-desc { font-size: 13px; color: #888; margin-bottom: 20px; }
        .settings-action-btn {
            width: 100%; padding: 12px; background: var(--accent); color: black;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            font-size: 15px;
        }
        
        /* --- SWITCH TOGGLE (Ajustes) --- */
        .switch-container {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;
        }
        .switch-label { font-size: 15px; color: white; font-weight: 500; }
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(22px); }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s ease-out;
        }
        .splash-content { text-align: center; display: flex; flex-direction: column; align-items: center; }
        .loading-spinner {
            width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1);
            border-left-color: var(--accent); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #splash-status { color: #888; font-size: 14px; font-weight: 500; display: none; margin-top: 20px; }
        #retry-btn {
            margin-top: 20px; padding: 10px 25px; background: var(--accent); color: black;
            border: none; border-radius: 20px; font-weight: bold; cursor: pointer; display: none;
        }

        /* --- PAGINACIÓN --- */
        .pagination-container {
            display: flex; justify-content: center; gap: 8px; padding: 20px 0;
            width: 100%;
        }
        .page-btn {
            background: #1e1e24; color: #ccc; border: none;
            width: 35px; height: 35px; border-radius: 50%;
            font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, color 0.2s;
        }
        .page-btn.active {
            background: var(--accent); color: black;
        }

        /* --- NUEVA NAVEGACIÓN INFERIOR --- */
        .bottom-nav {

<script>
    // --- VARIABLES DE ESTADO ---
    let currentAnime = null;
    let currentEpIndex = 0;
    let hasPlayedAnyVideo = false; // [NUEVO] Flag para la nueva lógica de autoplay
    let isRestrictedMode = false;
    let privatePage = 1; // Página actual del modo privado
    const itemsPerPage = 20; // 2 columnas * 10 filas = 20 items
    const SECRET_CODE = atob("NDU2MA=="); // Código de acceso (codificado)

    // --- ELEMENTOS DOM ---
    const homeView = document.getElementById('home-view');
    const exploreView = document.getElementById('explore-view');

    // --- INICIO ---
    function initApp() {
        if(!window.location.hash) window.location.hash = "home";
        
        // Cargar estado del switch
        const savedState = localStorage.getItem('myApp_restrictedMode');
        if (savedState === 'true') {
            isRestrictedMode = true;
            library = privateLibrary;
        } else {
            library = publicLibrary;
        }

        // Cargar color de acento guardado
        const savedColor = localStorage.getItem('myApp_accentColor');
        const colorSwitch = document.getElementById('accent-color-switch');
        if (savedColor === 'purple') {
            document.documentElement.style.setProperty('--accent', '#6c63ff');
            document.documentElement.style.setProperty('--glow', 'rgba(108, 99, 255, 0.35)');
            if (colorSwitch) colorSwitch.checked = true;
        } else {
            if (colorSwitch) colorSwitch.checked = false;
        }

        window.addEventListener('hashchange', handleRouting);
        handleRouting();
        
        setupTouchControls();

        // [NUEVO] Listener para activar el flag de autoplay después del primer play manual.
        mainVideo.addEventListener('play', () => {
            if (!hasPlayedAnyVideo) {
                hasPlayedAnyVideo = true;
            }
        });

    // --- EVENTOS DE CARGA (SPINNER) ---
    mainVideo.addEventListener('loadstart', () => videoLoader.style.display = 'block'); // Al empezar a cargar
    mainVideo.addEventListener('waiting', () => videoLoader.style.display = 'block');   // Si se detiene por buffer
    mainVideo.addEventListener('canplay', () => videoLoader.style.display = 'none');   // Cuando ya puede reproducir
    mainVideo.addEventListener('playing', () => videoLoader.style.display = 'none');   // Cuando ya está reproduciendo
    mainVideo.addEventListener('error', () => videoLoader.style.display = 'none');     // Si hay error
    }

    function openSearchOverlay() {
        document.getElementById('search-overlay').classList.add('active');
        document.getElementById('overlay-search-input').focus();
    }

    function closeSearchOverlay() {
        document.getElementById('search-overlay').classList.remove('active');
        document.getElementById('overlay-search-input').value = "";
        document.getElementById('global-search-results').innerHTML = "";
    }

    function handleRouting() {
        const hash = window.location.hash;

        if (hash.startsWith('#detail') && currentAnime) {
            showDetailView();
        } else if (hash === '#settings') {
            showSettingsView();
        } else {
            showHomeView();
        }
        updateNavActiveState(hash);
    }

    function switchTab(tab) {
        const hash = '#' + tab;
        if (window.location.hash !== hash) {
            // Usar pushState para que el botón de atrás del navegador funcione
            history.pushState({ tab }, null, hash);
            handleRouting();
        }
    }
    // Manejar el botón "atrás" del navegador
    window.onpopstate = handleRouting;

    function enterPrivateMode() {
        const settingsCodeInput = document.getElementById('settings-code-input');
        if (!settingsCodeInput) return;

        if (settingsCodeInput.value === SECRET_CODE) {
            isRestrictedMode = true;
            library = privateLibrary;
            localStorage.setItem('myApp_restrictedMode', 'true');
            switchTab('home');
        } else {
            settingsCodeInput.classList.add('shake');
            setTimeout(() => settingsCodeInput.classList.remove('shake'), 700);
            settingsCodeInput.value = "";
        }
    }

    function exitPrivateMode() {
        isRestrictedMode = false;
        library = publicLibrary;
        privatePage = 1; // Resetear página al salir del modo privado
        localStorage.setItem('myApp_restrictedMode', 'false');
        renderHome();
        window.scrollTo(0, 0);
    }

    function toggleAccentColor(checkbox) {
        const root = document.documentElement;
        if (checkbox.checked) {
            // Cambiar a Morado
            root.style.setProperty('--accent', '#6c63ff');
            root.style.setProperty('--glow', 'rgba(108, 99, 255, 0.35)');
            localStorage.setItem('myApp_accentColor', 'purple');
        } else {
            // Volver a Rojo (Original)
            root.style.setProperty('--accent', '#e63946');
            root.style.setProperty('--glow', 'rgba(230, 57, 70, 0.35)');
            localStorage.setItem('myApp_accentColor', 'red');
        }
    }

    // ===== CARRUSEL HERO =====
    let _heroCurrent = 0;
    let _heroTimer = null;
    let _heroTotal = 3;

    function heroGoTo(idx) {
        const slides = document.querySelectorAll('.hero-slide');
        const dots = document.querySelectorAll('.hero-dot');
        if (!slides[idx] || !slides[_heroCurrent] || !dots[_heroCurrent]) return;
        slides[_heroCurrent].classList.remove('active');
        dots[_heroCurrent].classList.remove('active');
        _heroCurrent = idx;
        slides[idx].classList.add('active');
        dots[idx].classList.add('active');
        resetHeroTimer();
    }

    function heroNext() {
        heroGoTo((_heroCurrent + 1) % _heroTotal);
    }

    function resetHeroTimer() {
        clearInterval(_heroTimer);
        _heroTimer = setInterval(heroNext, 4500);
    }

    function initHeroCarousel() {
        _heroCurrent = 0;
        _heroTotal = document.querySelectorAll('.hero-slide').length;
        resetHeroTimer();
    }

    // --- RENDERIZADO ---
    function renderHome() {
        const homeContent = document.querySelector('.home-content');

                <div class="full-list-grid" id="private-grid"></div>
                <div id="private-pagination" class="pagination-container"></div>
            `;
            renderPrivateGrid();
        } else {
            // --- MODO PÚBLICO (LISTAS HORIZONTALES) ---
            document.getElementById('bottom-nav').style.display = 'flex';
            homeContent.innerHTML = `
                <div class="hero-carousel" id="hero-carousel">
                    <!-- Populated by JS -->
                </div>
                <div class="section-title">Recientes</div>
                <div class="horizontal-list" id="recent-list"></div>

                <div class="section-title">Reciente en Series</div>
                <div class="horizontal-list" id="series-list"></div>

                <div class="section-title">Más populares</div>
                <div class="horizontal-list" id="popular-list"></div>
            `;

            // --- Llenar Carrusel ---
            const heroCarousel = document.getElementById('hero-carousel');
            let recentItems = typeof recientesData !== 'undefined' ? recientesData : [];
            let popularItems = typeof popularesData !== 'undefined' ? popularesData : [];
            let seriesItems = typeof seriesData !== 'undefined' ? seriesData : [];
            let heroSources = [...recentItems, ...popularItems].filter(a => a.banner || a.poster).slice(0, 3);
            
            let heroHTML = '';
            heroSources.forEach((anime, i) => {
                const onclickAction = `openAnimeDetail(library.find(a => a.titulo === '${anime.titulo.replace(/'/g, "\\'")}'))`;
                const epCount = (anime.episodios && anime.episodios.length) ? anime.episodios.length : 0;

                let titleOrLogo = `<div class="hero-title">${anime.titulo}</div>`;

    function playEpisode(index, isAutoChained = false) {
        if (!currentAnime || !currentAnime.episodios[index]) return;
        currentEpIndex = index;
        const episode = currentAnime.episodios[index];

        // Primero, revisamos si la app de Android nos está "escuchando".
        if (typeof Android !== 'undefined' && Android.playVideo) {
            // Si es así, le pasamos las URLs al código nativo de Java.
            const videoLink = episode.link;
            const subtitleLink = episode.subtitulo || null; // Si no hay subtitulo, pasamos null

            if (subtitleLink) {
                Android.playVideo(videoLink, subtitleLink);
            } else {
                Android.playVideo(videoLink);
            }
            
        } else {
            // Si no estamos en la app, usamos el reproductor web personalizado.
            console.log("Interfaz 'Android' no encontrada. Usando reproductor web.");
            heroImg.style.display = "none";
            videoContainer.style.display = "block"; // Mostrar el contenedor del nuevo reproductor
            if (episode.thumb) {
                mainVideo.poster = episode.thumb;
            } else {
                mainVideo.removeAttribute("poster");
            }
            mainVideo.src = episode.link;
            mainVideo.load(); // Forzar al navegador a procesar el nuevo video inmediatamente
            
            mainVideo.currentTime = 0;
            // Reiniciar barra de progreso
            progressBar.style.width = '0%';
            progressKnob.style.left = '0%';
            
            // Cargar Sprite si existe
            loadSprite(episode.sprite, episode.spriteImg);

            // Lógica de reproducción y estado de UI
            if (isAutoChained || hasPlayedAnyVideo) {
                mainVideo.play();
                videoContainer.classList.remove('paused');
                btnCenter.innerHTML = iconPause;
            } else {
                // Forzar estado pausado en carga manual inicial
                mainVideo.pause();
                videoContainer.classList.add('paused');
                btnCenter.innerHTML = iconPlay;
            }
            
            // Cargar subtítulos para el reproductor web
            if (octopusInstance) { octopusInstance.freeTrack(); octopusInstance = null; }
            setupSubtitles(episode);
        }

        // El resto de la función para actualizar la UI se mantiene.
        const buttons = epSelector.querySelectorAll('.ep-box');
        buttons.forEach((btn, i) => {
            btn.classList.toggle('active', i === index);
        });
        
        if(buttons[index]) {
            buttons[index].scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
        }

        if (!isAutoChained) {
            document.getElementById('hero-area').scrollIntoView({ behavior: 'smooth' });
        }
    }

    // 3. Barra de Progreso
    const formatTime = s => {
        if (isNaN(s)) return "0:00";
        const m = Math.floor(s/60);
        const sc = Math.floor(s%60);
        return `${m}:${sc<10?'0':''}${sc}`;
    };
    mainVideo.addEventListener('loadedmetadata', () => durTimeText.textContent = formatTime(mainVideo.duration));
    
    mainVideo.addEventListener('timeupdate', () => {

    // --- LÓGICA DE SPRITES ---
    let spriteData = [];
    let spriteTotalWidth = 0;
    let spriteTotalHeight = 0;

    function loadSprite(url, imgOverride) {
        spriteData = [];
        spriteTotalWidth = 0;
        spriteTotalHeight = 0;
        if (!url) return;
        
        // Obtener la ruta base del archivo VTT para resolver imágenes relativas
        const lastSlash = url.lastIndexOf('/');
        const baseUrl = lastSlash !== -1 ? url.substring(0, lastSlash + 1) : '';

        fetch(url)
            .then(r => r.text())
            .then(text => {
                const lines = text.split('\n');
                // Corregido: Regex flexible para soportar MM:SS.mmm y HH:MM:SS.mmm
                const timeRegex = /(?:(\d{2}):)?(\d{2}):(\d{2})\.(\d{3})/;
                const parseTime = (t) => {
                    const parts = t.match(timeRegex);
                    if(!parts) return 0;
                    const h = parts[1] ? parseInt(parts[1]) : 0;
                    const m = parseInt(parts[2]);
                    const s = parseInt(parts[3]);
                    const ms = parseInt(parts[4]);
                    return h*3600 + m*60 + s + ms/1000;
                };
                
                let currentStart = 0;
                let currentEnd = 0;
                
                for(let i=0; i<lines.length; i++) {
                    const line = lines[i].trim();
                    if(line.includes('-->')) {
                        const times = line.split('-->');
                        currentStart = parseTime(times[0].trim());
                        currentEnd = parseTime(times[1].trim());
                    } else if (line.includes('#xywh=')) {
                        let [imgUrl, coords] = line.split('#xywh=');
                        
                        if (imgOverride) {
                            imgUrl = imgOverride;
                        } else if (imgUrl && !imgUrl.includes('://') && !imgUrl.startsWith('data:')) {
                            imgUrl = baseUrl + imgUrl;
                        }

                        const [x, y, w, h] = coords.split(',');
                        spriteData.push({ start: currentStart, end: currentEnd, url: imgUrl, x, y, w, h });
                    }
                }

                // Precargar imagen para obtener dimensiones totales (necesario para el escalado HD)
                if (spriteData.length > 0) {
                    const img = new Image();
                    img.src = spriteData[0].url;
                    img.onload = () => {
                        spriteTotalWidth = img.naturalWidth;
                        spriteTotalHeight = img.naturalHeight;
                    };
                }
            })
            .catch(e => console.error("Error loading sprite:", e));
    }

    // Función para actualizar la miniatura
    const updatePreview = (clientX) => {
        // Si no hay sprites cargados, no mostrar el cuadro de vista previa
        if (spriteData.length === 0) {
            previewBox.style.display = 'none';
            return;
        }

        const rect = progressArea.getBoundingClientRect();
        let pos = (clientX - rect.left) / rect.width;
        pos = Math.max(0, Math.min(1, pos));
        const time = pos * mainVideo.duration;

        // Posición visual (clamp para que no se salga de la pantalla)
        const boxWidth = 160; 
        const visualX = Math.max(boxWidth/2, Math.min(rect.width - boxWidth/2, pos * rect.width));
        
        previewBox.style.left = `${visualX}px`;
        previewBox.style.display = 'block';

        // Mostrar sprite si existe datos
        if (spriteData.length > 0) {
            const cue = spriteData.find(c => time >= c.start && time < c.end);
            if (cue) {
                previewImg.style.display = 'block';
                previewImg.style.backgroundImage = `url(${cue.url})`;
                
                const spriteW = parseFloat(cue.w);
                // Auto-escalado: Si el sprite es más grande que la caja (160px), lo reducimos proporcionalmente
                if (spriteTotalWidth > 0 && spriteW > 160) {
                    const scale = 160 / spriteW;
                    const bgW = spriteTotalWidth * scale;
                    const bgH = spriteTotalHeight * scale;
                    const bgX = parseFloat(cue.x) * scale;
                    const bgY = parseFloat(cue.y) * scale;
                    
                    previewImg.style.backgroundSize = `${bgW}px ${bgH}px`;
                    previewImg.style.backgroundPosition = `-${bgX}px -${bgY}px`;
                } else {
                    // Tamaño nativo (160px o menor)
                    previewImg.style.backgroundSize = 'auto';
                    previewImg.style.backgroundPosition = `-${cue.x}px -${cue.y}px`;
                }
            } else {
                previewImg.style.display = 'none';
            }
        } else {
            previewImg.style.display = 'none';
        }
    };

    let scrubTargetTime = null;

    const scrub = (e) => {
        const rect = progressArea.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX; 
        let pos = (clientX - rect.left) / rect.width;
        pos = Math.max(0, Math.min(1, pos));
        
        const pct = pos * 100;
        progressBar.style.width = `${pct}%`;
        progressKnob.style.left = `${pct}%`;
        
        if (mainVideo.duration) {
            scrubTargetTime = pos * mainVideo.duration;
            currTimeText.textContent = formatTime(scrubTargetTime);
        }
        updatePreview(clientX); // Mostrar miniatura al arrastrar
    };
    
    let isScrubbing = false;
    
    const startScrub = (e) => { 
        isScrubbing = true; 
        showControls();
        scrub(e); 
    };
    const moveScrub = (e) => { 
        if (isScrubbing) { 
            e.preventDefault(); 
            showControls();
            scrub(e); 
        } 
    };
    const endScrub = () => { 
        if (!isScrubbing) return;
        isScrubbing = false; 
        previewBox.style.display = 'none'; 
        if (scrubTargetTime !== null) {
            mainVideo.currentTime = scrubTargetTime;
            scrubTargetTime = null;
        }
        showControls();
    };

    progressArea.addEventListener('mousedown', startScrub);
    progressArea.addEventListener('touchstart', startScrub, { passive: false });
    
    // Eventos para Hover (PC)
    progressArea.addEventListener('mousemove', (e) => updatePreview(e.clientX));
    progressArea.addEventListener('mouseleave', () => previewBox.style.display = 'none');
    
    document.addEventListener('mousemove', moveScrub);
    document.addEventListener('touchmove', moveScrub, { passive: false });
    
    document.addEventListener('mouseup', endScrub);
    document.addEventListener('touchend', endScrub);

    // 4. Subtítulos
    function setupSubtitles(episode) {
        // Ocultar menú
        ccMenu.style.display = 'none';
        ccMenu.innerHTML = '';
        currentSubUrl = 'none';
        btnCC.classList.remove('cc-active');

        // Evitar error si la librería de subtítulos no cargó (offline o bloqueo)
        if (typeof SubtitlesOctopus === 'undefined') return;

        // Función auxiliar para cargar
        const loadSub = (url) => {
            if (!octopusInstance) {
                octopusInstance = new SubtitlesOctopus({
                    video: mainVideo,
                    subUrl: url,
                    fonts: ['https://todesvip.github.io/visor-manga/fonts/Arial.woff2', 'https://todesvip.github.io/visor-manga/fonts/trebuc.ttf', 'https://todesvip.github.io/visor-manga/fonts/Franco-C3SA.ttf'],

                });
            } else {
                octopusInstance.setTrackByUrl(url);
            }
        };

        // Opción Desactivado
        const noneBtn = document.createElement('button');
        noneBtn.textContent = 'None';
        noneBtn.dataset.url = 'none';
        noneBtn.onclick = () => {
            subtitlePreference = 'none'; // Guardar preferencia

            updateCCMenu('none');
        };
        ccMenu.appendChild(noneBtn);

        const subEs = episode.subtitulo;
        const subEn = episode.subtitulo_eng;

        // Botón Español
        if (subEs) {
            const subBtn = document.createElement('button');
            subBtn.textContent = 'Español';
            subBtn.dataset.url = subEs;
            subBtn.onclick = () => {
                subtitlePreference = 'Español'; // Guardar preferencia
                loadSub(subEs);
                updateCCMenu(subEs);
            };
            ccMenu.appendChild(subBtn);
        }

        // Botón Inglés
        if (subEn) {
            const subBtn = document.createElement('button');
            subBtn.textContent = 'English';
            subBtn.dataset.url = subEn;
            subBtn.onclick = () => {
                subtitlePreference = 'English';
                loadSub(subEn);
                updateCCMenu(subEn);
            };
            ccMenu.appendChild(subBtn);
        }

        // Auto-activar según preferencia
        if (subtitlePreference === 'Español' && subEs) {
            loadSub(subEs);
            updateCCMenu(subEs);
        } else if (subtitlePreference === 'English' && subEn) {
            loadSub(subEn);
            updateCCMenu(subEn);
        } else {
            updateCCMenu('none');
        }
    }

            item.className = 'search-result-card';
            item.innerHTML = `
                <img src="${anime.poster}" class="search-poster-img">
                <div class="search-info">
                    <div class="search-title">${anime.titulo}</div>
                    <div class="search-desc">${anime.sinopsis || 'Sin descripción.'}</div>
                </div>
            `;
            item.onclick = () => {
                globalSearchResults.style.display = 'none';
                closeSearchOverlay();
                openAnimeDetail(anime);
            };
            globalSearchResults.appendChild(item);
        });

        if (filtered.length === 0) {
            globalSearchResults.innerHTML = "<div style='padding:20px; color:#888; text-align:center;'>No se encontraron resultados</div>";
        }
    }

    // --- LÓGICA FILTRO DE FECHAS ---
    function toggleDateDropdown(e) {
        e.stopPropagation();
        const dd = document.getElementById('dateDropdown');
        const btn = document.getElementById('dateFilterBtn');
        dd.classList.toggle('show');
        btn.classList.toggle('active');
        
        // Generar lista de años si está vacía
        const list = document.getElementById('year-list');
        if (list.children.length === 0) {
            const currentYear = new Date().getFullYear();
            let html = `<li onclick="filtrarAnime('all')">Todos</li>`;
            for (let y = currentYear; y >= 1990; y--) {
                html += `<li onclick="filtrarAnime('${y}')">${y}</li>`;
            }
            html += `<li onclick="filtrarAnime('old')">Clásicos</li>`;
            list.innerHTML = html;
        }
    }

    // Cerrar dropdown al hacer clic fuera
    document.addEventListener('click', (e) => {
        const dd = document.getElementById('dateDropdown');
        const btn = document.getElementById('dateFilterBtn');
        if (dd && dd.classList.contains('show') && !dd.contains(e.target) && !btn.contains(e.target)) {
            dd.classList.remove('show');
            btn.classList.remove('active');
        }
    });

    function filtrarAnime(year) {
        // Cerrar menú
        document.getElementById('dateDropdown').classList.remove('show');
        document.getElementById('dateFilterBtn').classList.remove('active');

        // Limpiar input de texto para evitar confusión
        document.getElementById('overlay-search-input').value = "";

        // Filtrar
        let filtered = [];
        if (year === 'all') {
            filtered = library;
        } else if (year === 'old') {
            filtered = library.filter(a => parseInt(a.ano) < 1990);
        } else {
            filtered = library.filter(a => a.ano && a.ano.toString().includes(year));
        }

        // Mostrar resultados usando la misma lógica que la búsqueda
        globalSearchResults.style.display = 'block';
        globalSearchResults.innerHTML = "";

        if (filtered.length === 0) {
            globalSearchResults.innerHTML = "<div style='padding:20px; color:#888; text-align:center;'>No hay animes de este año.</div>";
            return;
        }

        filtered.forEach(anime => {
            const item = document.createElement('div');
            item.className = 'search-result-card';
            item.innerHTML = `
                <img src="${anime.poster}" class="search-poster-img">
                <div class="search-info">
                    <div class="search-title">${anime.titulo}</div>
                    <div class="search-desc">${anime.ano || 'N/A'} - ${anime.sinopsis || 'Sin descripción.'}</div>
                </div>
            `;
            item.onclick = () => {
                globalSearchResults.style.display = 'none';
                closeSearchOverlay();
                openAnimeDetail(anime);
            };
            globalSearchResults.appendChild(item);
        });
    }

    // El listener para el final del video ahora llama a playEpisode con el segundo parámetro en 'true'
    mainVideo.addEventListener('ended', () => {
        if (currentAnime && currentEpIndex < currentAnime.episodios.length - 1) {
            playEpisode(currentEpIndex + 1, true);
        }
    });

    try {
        initApp();
    } catch (e) {
        console.error("Error al iniciar la app:", e);
    }
    
    // --- LOGICA DE INICIO (SPLASH SCREEN) ---
    async function launchApp() {
        const splash = document.getElementById('splash-screen');
        const status = document.getElementById('splash-status');
        const spinner = document.getElementById('splash-spinner');
        const retryBtn = document.getElementById('retry-btn');

        // 1. Verificar conexión básica
        if (!navigator.onLine) {
            showError("Sin conexión a internet");
            return;
        }

        // 2. Precargar imágenes
        try {
            
            // Recolectar imágenes
            // OPTIMIZACIÓN: Solo precargar las primeras imágenes para evitar bloqueo
            const imagesToLoad = [];
            // Limitar a los primeros 15 items para asegurar un inicio rápido
            const itemsToPreload = (typeof library !== 'undefined' && Array.isArray(library)) ? library.slice(0, 15) : [];
            itemsToPreload.forEach(anime => {
                if(anime.poster) imagesToLoad.push(anime.poster);
                if(anime.banner) imagesToLoad.push(anime.banner);
            });

            // Crear promesas de carga
            const loadPromises = imagesToLoad.map(src => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.src = src;
                    img.onload = resolve;
                    img.onerror = resolve; // Continuar aunque falle una imagen específica
                });
            });

            // Esperar a que carguen (o timeout de 8s)
            await Promise.race([
                Promise.all(loadPromises),
                new Promise(resolve => setTimeout(resolve, 8000))
            ]);

            // 3. Transición al Home
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
            }, 500);

        } catch (e) {
            console.error("Error en carga:", e);
            // En caso de error inesperado, dejar entrar
            splash.style.display = 'none';
        }

        function showError(msg) {
            spinner.style.display = 'none';
            status.innerText = msg;
            status.style.display = 'block';
            status.style.color = '#ff4444';
            retryBtn.style.display = 'block';
        }
    }

    // Ejecutar carga
    launchApp();

</script>
</body>
