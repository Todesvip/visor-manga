# Arma cine/Archivos/primicias.json cada hora con el buscador de muchohentai (scripts/build_primicias.py)
# y lo sube al repo. GitHub Pages lo sirve en https://todesvip.github.io/visor-manga/cine/Archivos/primicias.json
# y la app solo lo descarga (config/urls/primicias en Firebase).
#
# Para cambiar cada cuánto corre, toca solo la línea del cron (está en hora UTC; Lima = UTC-5):
#   "23 * * * *"    cada hora, al minuto 23
#   "23 */3 * * *"  cada 3 horas
# También se puede lanzar a mano: pestaña Actions → "Primicias H en español" → Run workflow.

name: Primicias H en español

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: primicias
  cancel-in-progress: false

jobs:
  armar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Bajar el repo
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install requests

      - name: Armar primicias.json
        run: python scripts/build_primicias.py --salida cine/Archivos/primicias.json

      - name: Subir al repo si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cine/Archivos/primicias.json
          if git diff --cached --quiet; then
            echo "Sin cambios: no se sube nada"
            exit 0
          fi
          git commit -m "primicias.json: actualización automática ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git push
